<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIEM Security Operations Center</title>
  <meta name="description" content="Real-time Security Information and Event Management platform for monitoring SSH brute-force attacks and managing security incidents." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ── Top Navigation ─────────────────────────────── -->
  <nav class="navbar">
    <div class="nav-brand">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">SIEM-Lab</span>
        <span class="brand-subtitle">Security Operations Center</span>
      </div>
    </div>
    <div class="nav-status">
      <div id="connection-dot" class="status-dot dot-green"></div>
      <span id="connection-label" class="status-label">Live</span>
      <div class="nav-time" id="nav-time">--:--:-- UTC</div>
    </div>
  </nav>

  <!-- ── Main Layout ────────────────────────────────── -->
  <main class="layout">

    <!-- ── Stats Row ──────────────────────────────── -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card" id="stat-total">
        <div class="stat-icon icon-blue">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        </div>
        <div class="stat-body">
          <div class="stat-value" id="total-count">--</div>
          <div class="stat-label">Total Incidents</div>
        </div>
      </div>
      <div class="stat-card" id="stat-open">
        <div class="stat-icon icon-red">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>
        <div class="stat-body">
          <div class="stat-value" id="open-count">--</div>
          <div class="stat-label">Open</div>
        </div>
      </div>
      <div class="stat-card" id="stat-blocked">
        <div class="stat-icon icon-orange">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
        </div>
        <div class="stat-body">
          <div class="stat-value" id="blocked-count">--</div>
          <div class="stat-label">Blocked</div>
        </div>
      </div>
      <div class="stat-card" id="stat-resolved">
        <div class="stat-icon icon-green">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="stat-body">
          <div class="stat-value" id="resolved-count">--</div>
          <div class="stat-label">Resolved</div>
        </div>
      </div>
      <div class="stat-card" id="stat-docs">
        <div class="stat-icon icon-purple">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        <div class="stat-body">
          <div class="stat-value" id="docs-count">--</div>
          <div class="stat-label">Log Events</div>
        </div>
      </div>
    </div>

    <!-- ── Content Grid ────────────────────────────── -->
    <div class="content-grid">

      <!-- Incidents table panel -->
      <div class="panel panel-main">
        <div class="panel-header">
          <h2 class="panel-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
            Active Incidents
          </h2>
          <div class="panel-controls">
            <select id="status-filter" class="filter-select">
              <option value="all">All Status</option>
              <option value="open">Open</option>
              <option value="blocked">Blocked</option>
              <option value="resolved">Resolved</option>
            </select>
            <button class="btn-refresh" id="refresh-btn" title="Refresh">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
            </button>
          </div>
        </div>
        <div class="table-wrapper">
          <table class="incidents-table" id="incidents-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Source IP</th>
                <th>Severity</th>
                <th>Count</th>
                <th>First Seen</th>
                <th>Last Seen</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="incidents-tbody">
              <tr><td colspan="8" class="empty-row">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Right sidebar -->
      <div class="sidebar">

        <!-- Top Attackers -->
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              Top Attackers
            </h2>
          </div>
          <div id="top-attackers" class="attacker-list">
            <div class="attacker-empty">No data yet</div>
          </div>
        </div>

        <!-- Recent Webhooks -->
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
              Recent Alerts
            </h2>
          </div>
          <div id="recent-webhooks" class="webhook-list">
            <div class="webhook-empty">No webhooks received yet</div>
          </div>
        </div>

      </div>
    </div>

  </main>

  <!-- ── Toast container ────────────────────────────── -->
  <div id="toast-container"></div>

  <!-- ── Incident detail modal ──────────────────────── -->
  <div id="detail-modal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Incident Detail</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div id="modal-body" class="modal-body">
        <pre id="modal-json" class="json-pre"></pre>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

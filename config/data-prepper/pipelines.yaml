security-pipeline:
  workers: 2
  delay: 100
  source:
    kafka:
      bootstrap_servers:
        - "kafka:29092"
      encryption:
        type: "none"
      topics:
        - name: "security-logs"
          group_id: "data-prepper"
          serde_format: "json"
          auto_offset_reset: "earliest"
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index: "security-logs"
        insecure: true
        document_id: "${/doc_id}"

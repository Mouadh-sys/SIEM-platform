security-pipeline:
  workers: 2
  delay: 100
  source:
    kafka:
      bootstrap_servers:
        - "kafka:29092"
      topics:
        - name: "security-logs"
          group_id: "data-prepper"
          serde_format: "json"
          auto_offset_reset: "earliest"
  processor:
    - fingerprint:
        source_fields:
          - "src_ip"
          - "user"
          - "port"
          - "@timestamp"
        target_metadata_key: "doc_id"
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index: "security-logs"
        insecure: true
        document_id: "${getMetadata(\"doc_id\")}"

[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name            tail
    Tag             auth.log
    Path            /data/auth.log
    # Store the raw line in `message` before the parser overwrites it
    Key             message
    Read_from_Head  On
    # No DB file → offsets reset on container restart (safe for demo replays)

[FILTER]
    Name            parser
    Match           auth.log
    Key_Name        message
    Parser          sshd-failed-invalid
    Parser          sshd-failed
    Parser          sshd-accepted
    Parser          sshd-invalid-user
    Reserve_Data    On

[FILTER]
    Name            lua
    Match           auth.log
    script          /fluent-bit/etc/normalize.lua
    call            process_auth

[OUTPUT]
    Name              kafka
    Match             auth.log
    Brokers           kafka:29092
    Topics            security-logs
    Format            json
    timestamp_key     @timestamp
    timestamp_format  iso8601

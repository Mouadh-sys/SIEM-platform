[PARSER]
    Name        sshd-failed-invalid
    Format      regex
    Regex       ^(?<timestamp>[A-Z][a-z]{2}\s+\d+\s+\d{2}:\d{2}:\d{2})\s+(?<host>[\w\.\-]+)\s+(?<process>sshd)\[(?<pid>\d+)\]:\s+(?<raw_event>Failed password) for invalid user (?<user>\S+) from (?<src_ip>\d+\.\d+\.\d+\.\d+) port (?<port>\d+).*$
    Time_Key    timestamp
    Time_Format %b %d %H:%M:%S
    Time_Keep   On
    Time_Offset +0000
    Types       port:integer

[PARSER]
    Name        sshd-failed
